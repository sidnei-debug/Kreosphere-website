<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Inquiry Sent | Kreosphere</title>

    <link
        rel="icon"
        type="image/png"
        href="assets/kreosphere-favicon.png"
    >

    <link
        rel="stylesheet"
        href="styles.css"
    >

</head>


<body>

    <main class="success-page">

        <div class="success-card">

            <div class="success-icon">
                ✓
            </div>

            <h1>
                Inquiry Sent Successfully

            <p>
                Thank you for reaching out to Kreosphere.
                We've received your project inquiry and
                will get back to you soon.
            </p>

            <div class="success-actions">

                <a
                    href="index.html"
                    class="primary-button"
                >
                    Back to Home
                </a>

                <a
                    href="contact.html"
                    class="secondary-button"
                >
                    Submit Another Inquiry
                </a>

            </div>

        </div>

    </main>

</body>

</html>
