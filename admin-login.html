<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Kreosphere Admin Login</title>

    <link
        rel="icon"
        type="image/png"
        href="assets/kreosphere-favicon.png"
    >

    <link
        rel="stylesheet"
        href="styles.css"
    >

</head>


<body>

    <main class="admin-login-page">

        <div class="admin-login-box">

            <img
                src="assets/kreosphere-logo-white.png"
                alt="Kreosphere"
                class="admin-login-logo"
            >

            <h1>
                Admin Login
            </h1>

            <p>
                Sign in to access the Kreosphere dashboard.
            </p>


            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn btn-primary"
                    id="loginButton"
                >
                    Sign In
                </button>


                <p
                    id="loginError"
                    class="login-error"
                ></p>

            </form>

        </div>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="admin-login.js"></script>

</body>

</html>
